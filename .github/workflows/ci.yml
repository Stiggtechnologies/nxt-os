name: NXT validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify native application contracts
        run: cargo test --locked
      - name: Verify browser and operational scripts
        run: |
          node --check public/apps/tax/tax.js
          node --check public/apps/engagements/engagements.js
          node --check scripts/backup-nxt-store.mjs
          node --check scripts/cutover-rehearsal.mjs
          node --test tests/cutover_rehearsal.test.mjs
