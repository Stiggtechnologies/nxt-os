name: NXT validation
on:
  pull_request:
    branches: [main, feature/dtmax-tax-suite]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify native application contracts
        run: cargo test --locked
      - name: Verify browser and operational scripts
        run: |
          node --check public/apps/tax/tax.js
          node --check public/apps/firm/firm.js
          node --check public/apps/engagements/engagements.js
          node --check public/apps/migrations/migrations.js
          node --check public/apps/signatures/signatures.js
          node --check public/apps/ledger/qb-navigation.js
          node --check scripts/publish-shadow-snapshot.mjs
          node --check scripts/backup-nxt-store.mjs
          node --check scripts/cutover-rehearsal.mjs
          node --check scripts/migration-preflight.mjs
          node --test tests/cutover_rehearsal.test.mjs
          node --test tests/migration_preflight.test.mjs
          node --test tests/shadow_publisher.test.mjs
          node --test tests/qb_navigation.test.mjs
          node --test tests/signatures_navigation.test.mjs
          node --test tests/engagement_annotations.test.mjs
          node --test tests/engagement_preview.test.mjs
      - name: Verify bounded QuickBooks financial report assessment
        run: python3 -B -m unittest discover -s tests -p test_qbo_export.py
      - name: Verify source-preserving parallel test preparation
        run: python3 -B -m unittest discover -s tests -p test_shadow_snapshot.py
