<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Read-only source snapshots and parallel migration review inside NXT OS.">
  <title>NXT Migrations · Parallel review</title>
  <link rel="stylesheet" href="/nxt/brand.css">
  <link rel="stylesheet" href="migrations.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to source review</a>
  <div class="migration-app">
    <nav class="app-rail" aria-label="NXT applications">
      <button class="rail-brand" data-os="home" aria-label="NXT OS home">NXT</button>
      <a href="#worklist" aria-current="page"><span aria-hidden="true">▤</span>Snapshots</a>
      <span class="rail-spacer"></span>
      <button data-os="firm"><span aria-hidden="true">▦</span>Firm</button>
      <button data-os="ledger"><span aria-hidden="true">≡</span>Ledger</button>
      <button data-os="engagements"><span aria-hidden="true">◇</span>Engagements</button>
    </nav>
    <div class="app-shell">
      <header class="app-header"><div><strong>Migrations</strong><span>NXT OS / Parallel source review</span></div><button class="btn sm" data-action="refresh">Refresh</button></header>
      <main id="main" tabindex="-1" aria-live="polite"><div class="loading" role="status">Loading source snapshots…</div></main>
      <footer><span>NXT · Evidence before cutover</span><span id="storage-label">Shared workspace access</span></footer>
    </div>
  </div>
  <script src="/nxt/ui.js"></script>
  <script src="migrations.js"></script>
</body>
</html>
