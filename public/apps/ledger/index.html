<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NXT Ledger</title>
<link rel="stylesheet" href="/nxt/brand.css">
<link rel="stylesheet" href="qb-navigation.css">
<link rel="stylesheet" href="company-books-bridge.css">
<style>
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { border-right: 1px solid var(--line); background: var(--panel); padding: 18px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side .brand { padding: 0 10px 16px; }
  .side .group { font: 600 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; }
  .side a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; text-decoration: none; }
  .side a:hover { background: var(--panel-2); color: var(--text); }
  .side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side .badge { margin-left: auto; font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; }
  main { padding: 26px clamp(16px, 3vw, 36px) 60px; min-width: 0; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head p { margin: 6px 0 0; color: var(--muted); }
  .lines th, .lines td { padding: 6px; }
  .lines input, .lines select { width: 100%; }
  .lines .del { color: var(--faint); background: none; border: 0; cursor: pointer; font-size: 16px; }
  .totals { margin-left: auto; width: min(320px, 100%); margin-top: 14px; }
  .totals div { display: flex; justify-content: space-between; padding: 4px 0; }
  .totals .grand { font: 600 18px var(--display); border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: 4px; color: var(--ink); }
  .doc-paper { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 44px); max-width: 860px; }
  .doc-paper .top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }
  .doc-paper .title { font: 700 30px var(--display); color: var(--ink); letter-spacing: -.02em; }
  .report h2 { margin: 18px 0 6px; font-size: 14px; color: var(--muted); font-family: var(--ui); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .report td.indent { padding-left: 22px; }
  .report tr.total td { font-weight: 600; border-top: 1px solid var(--line-2); }
  .report tr.grand td { font: 700 15px var(--display); color: var(--ink); border-top: 2px solid var(--ink); border-bottom: 0; }
  .report-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .report-list a { display: block; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: inherit; text-decoration: none; }
  .report-list a:hover { border-color: var(--accent); }
  .report-list b { display: block; color: var(--ink); font-family: var(--display); }
  .report-list span { color: var(--muted); font-size: 13px; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .menu-btn { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 40; width: 250px; transform: translateX(-100%); transition: transform .15s; box-shadow: var(--shadow); }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; margin-bottom: 12px; }
  }
  @media print { .side, .menu-btn { display: none; } .app { display: block; } main { padding: 0; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="Ledger">
    <div class="brand"><span class="nxt-mark" id="mark"></span></div>
    <section id="ledger-company-bridge" class="ledger-company-bridge" aria-label="Company books navigation"></section>
    <section id="qb-navigation" class="qb-navigation" aria-label="Observed QuickBooks navigation"><p class="qb-nav-help">Loading the observed menu inventory…</p></section>
    <details class="nxt-native-menu" open><summary>NXT native workspace</summary>
    <a href="#dashboard">Dashboard</a>
    <div class="group">Sales</div>
    <a href="#invoices">Invoices</a>
    <a href="#customers">Customers</a>
    <div class="group">Expenses</div>
    <a href="#bills">Bills</a>
    <a href="#vendors">Vendors</a>
    <div class="group">Banking</div>
    <a href="#banking">Bank feed <span class="badge" id="feedBadge" hidden></span></a>
    <a href="#registers">Registers</a>
    <a href="#reconcile">Reconcile</a>
    <div class="group">Accounting</div>
    <a href="#accounts">Chart of accounts</a>
    <a href="#journal">Journal entries</a>
    <a href="#reports">Reports</a>
    <div class="group">Company</div>
    <a href="#settings">Settings</a>
    <a href="#audit">Audit log</a>
    </details>
  </nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script src="/nxt/ui.js"></script>
<script src="qb-navigation.js"></script>
<script src="company-books-bridge.js"></script>
<script src="ledger.js"></script>
</body>
</html>
