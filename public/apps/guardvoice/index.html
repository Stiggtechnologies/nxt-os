<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuardVoice</title>
<link rel="stylesheet" href="/nxt/brand.css">
<style>
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .side { border-right: 1px solid var(--line); background: var(--panel); padding: 18px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .side .brand { padding: 0 10px 16px; }
  .side a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; text-decoration: none; }
  .side a:hover { background: var(--panel-2); color: var(--text); }
  .side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side .badge { margin-left: auto; font-size: 11px; background: var(--warn-soft); color: var(--warn); border-radius: 999px; padding: 0 7px; }
  main { padding: 26px clamp(16px, 3vw, 36px) 60px; min-width: 0; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .page-head p { margin: 6px 0 0; color: var(--muted); }
  .status-line { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .transcript { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; margin: 12px 0; }
  .bubble { max-width: 80%; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; }
  .bubble.caller { align-self: flex-end; background: var(--accent); color: var(--accent-ink); }
  .bubble.agent { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }
  .bubble.dropped { opacity: .45; text-decoration: line-through; }
  .composer { display: flex; gap: 8px; }
  .composer input { flex: 1; }
  .menu-btn { display: none; }
  .detail { margin-top: 14px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; z-index: 40; width: 250px; transform: translateX(-100%); transition: transform .15s; box-shadow: var(--shadow); }
    .side.open { transform: none; }
    .menu-btn { display: inline-flex; margin-bottom: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side" aria-label="GuardVoice">
    <div class="brand"><span class="nxt-mark" id="mark"></span></div>
    <a href="#activity">Activity</a>
    <a href="#calls">Calls</a>
    <a href="#approvals">Approvals <span class="badge" id="approvalBadge" hidden></span></a>
    <a href="#notifications">Notifications <span class="badge" id="noteBadge" hidden></span></a>
    <a href="#handoffs">Handoffs</a>
    <a href="#messages">SMS outbox</a>
    <a href="#simulator">Simulator</a>
  </nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<script src="/nxt/ui.js"></script>
<script src="guardvoice.js"></script>
</body>
</html>
