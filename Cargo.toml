[package]
name = "nxt_os"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
vercel_runtime = { version = "2", features = ["axum"] }

[[bin]]
name = "main"
path = "api/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
